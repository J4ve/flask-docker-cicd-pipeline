# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Set up the Python version we want to use on the runner
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install Flask and pytest from requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run the test suite — pipeline fails if any test fails
      - name: Run tests
        run: pytest -v

  # Second job — only runs if "build" (tests) succeeds
  docker:
    runs-on: ubuntu-latest
    # Wait for the test job to finish before starting this one
    needs: build

    steps:
      # Need the source code on the runner to build the image
      - uses: actions/checkout@v4

      # Configure Docker Buildx for faster, more reliable builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the Docker image from the Dockerfile in the repo root
      - name: Build Docker image
        run: docker build -t se2-finallt:${{ github.sha }} .

  # Third job — deploy to remote server only after image builds successfully
  deploy:
    runs-on: ubuntu-latest
    # Only deploy after the docker job (which already needs build) succeeds
    needs: docker
    # Only deploy on pushes to main, not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # SSH into the server and run the deploy commands
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Server details pulled from repo secrets
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Commands to run on the remote server
          script: |
            # Clone repo on first run, otherwise pull latest changes
            if [ ! -d ~/se2-finalLT ]; then
              git clone https://github.com/${{ github.repository }}.git ~/se2-finalLT
            fi
            cd ~/se2-finalLT
            git pull origin main
            # Rebuild image with latest code
            docker build -t se2-finallt:latest .
            # Stop and remove the old container if it exists, ignore errors if not
            docker rm -f se2-finallt || true
            # Start the new container, mapping port 80 on the host to 5000 in the container
            docker run -d --name se2-finallt -p 80:5000 --restart unless-stopped se2-finallt:latest
