# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Set up the Python version we want to use on the runner
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install Flask and pytest from requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run the test suite — pipeline fails if any test fails
      - name: Run tests
        run: pytest -v

  # Second job — only runs if "build" (tests) succeeds
  docker:
    runs-on: ubuntu-latest
    # Wait for the test job to finish before starting this one
    needs: build

    steps:
      # Need the source code on the runner to build the image
      - uses: actions/checkout@v4

      # Configure Docker Buildx for faster, more reliable builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the Docker image from the Dockerfile in the repo root
      - name: Build Docker image
        run: docker build -t se2-finallt:${{ github.sha }} .
